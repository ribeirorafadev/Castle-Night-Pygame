name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
      - 'Demo-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package (Windows x86_64)
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🏗️ Run Build Script (PowerShell)
        run: |
          .\build.ps1

      - name: 🗜️ Create Release Archive (.zip)
        run: |
          Compress-Archive -Path dist\CastleNight.exe, dist\assets -DestinationPath dist\CastleNight-Windows-x86_64.zip

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CastleNight-Windows-x86_64
          path: dist/CastleNight-Windows-x86_64.zip
          if-no-files-found: error

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/CastleNight-Windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
